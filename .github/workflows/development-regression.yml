name: Strength Lab development regression

on:
  push:
    branches:
      - development/reconciliation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-regression:
    name: Pure engine, calendar, notebook and timer tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show source checkpoint
        run: git log -1 --format='%h %s'
      - name: Run every root Node test suite
        shell: bash
        run: |
          shopt -s nullglob
          suites=( *.test.cjs )
          if (( ${#suites[@]} == 0 )); then
            echo 'No root Node suites found' >&2
            exit 1
          fi
          printf 'Running %s suite(s): %s\n' "${#suites[@]}" "${suites[*]}"
          for suite in "${suites[@]}"; do
            echo "::group::${suite}"
            node --test "${suite}"
            echo '::endgroup::'
          done

  mobile-browser:
    name: UX3 Pixel 5 browser acceptance and failure recovery
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright Chromium and browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          CHROMIUM_BIN="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          test -x "$CHROMIUM_BIN"
          sudo ln -s "$CHROMIUM_BIN" /usr/bin/chromium
      - name: UX3 touch acceptance
        run: python tests/ux3-review.py
      - name: UX3 storage failure, rollback and multi-tab
        run: python tests/ux3-failures.py
      - name: Preserve Android-sized acceptance screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux3-mobile-review-screenshot
          path: /tmp/strength-ux3-review.png
          if-no-files-found: ignore
          retention-days: 14

  source-provenance:
    name: Research mappings and publication safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify runtime source anchors
        run: python tests/programming-education.py
      - name: Verify publisher rejects unsafe targets
        run: python tests/preview-publisher.py

  preview-candidate:
    name: Build isolated DEV preview candidate
    needs: [node-regression, mobile-browser, source-provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build exact tested commit with separate browser data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build-preview.py --output "$RUNNER_TEMP/strength-lab-dev" --ref HEAD
          grep -q 'Development preview' "$RUNNER_TEMP/strength-lab-dev/index.html"
          grep -q 'sl-dev-preview-data-v33' "$RUNNER_TEMP/strength-lab-dev/app.js"
          ! grep -q "strengthlab-data-v33" "$RUNNER_TEMP/strength-lab-dev/app.js"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/strength-lab-dev/SOURCE-COMMIT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: strength-lab-dev-candidate
          path: ${{ runner.temp }}/strength-lab-dev/
          retention-days: 14
